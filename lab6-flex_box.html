<head>

    #flex_parent{
        display: flex;
        height: 100 vh;
        justify-content: space-evenly;

        box-sizing: border-box;

    <div id="flex_parent">
        <div><img src="https://picsum.photos/150/150?random=1" alt="random1" style="width: auto; height: auto;"></div>
        <div><img src="https://picsum.photos/250/250?random=2" alt="random2" style="width: auto; height: auto;"></div>
        <div><img src="https://picsum.photos/150/150?random=3" alt="random3" style="width: auto; height: auto;"></div>
    </div>
